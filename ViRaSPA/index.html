<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Every relative path (scripts, styles, fetched page files) resolves
       from the site root, whatever the URL depth - so /about/team still
       finds viraspa/viraspa.js. If the app is served from a sub-folder,
       change this to that folder, e.g. "/my-app/". -->
  <base href="/">
  <title>ViRaSPA</title>
  <meta name="description" content="A no-build single-page application framework in plain HTML, CSS and JavaScript.">
  <!-- Site icon for browser tabs and bookmarks (per-page share images are
       set in each route's head information instead). -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="app/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="app/assets/icons/apple-touch-icon.png">
</head>
<body>
  <noscript>
    <div style="max-width:560px;margin:3rem auto;padding:1.25rem 1.5rem;font:15px/1.5 system-ui,sans-serif;border:1px solid #e0b4b4;border-radius:8px;background:#fff6f6;color:#5a1a1a">
      <strong>This site needs JavaScript.</strong>
      <p>Please turn JavaScript on in your browser settings, then reload the page.</p>
    </div>
  </noscript>

  <!-- The app shell, built once. Two layouts share it: elements marked
       data-layout-only show only in those layouts (a route's `layout`
       chooses: "public", "private" or "inherit"). Only #page-root changes
       per route; data-visible-when follows the session. -->
  <div id="app">
    <vs-header sticky>
      <vs-brand slot="brand" name="ViRaSPA" logo="app/assets/icons/favicon.svg"></vs-brand>
      <vs-menu menu="main" data-layout-only="public"></vs-menu>
      <a slot="end" href="/login" class="header-action" data-layout-only="public" data-visible-when="signed-out">Sign In</a>
      <a slot="end" href="/dashboard" class="header-action" data-layout-only="public" data-visible-when="signed-in">Dashboard</a>
      <vs-user-menu slot="end" source="session" data-visible-when="signed-in"></vs-user-menu>
    </vs-header>
    <div class="app-body">
      <vs-sidebar collapsible data-layout-only="private">
        <vs-menu orientation="vertical" menu="side" label="App"></vs-menu>
      </vs-sidebar>
      <main id="page-root"></main>
    </div>
    <vs-footer data-layout-only="public">ViRaSPA — a no-build SPA framework in plain HTML, CSS and JavaScript · © 2026</vs-footer>
  </div>

  <!-- Project settings, read before anything else loads. This file must be
       served with "Cache-Control: no-cache" (node-tools/serve.js does), so a
       change here reaches every browser on its next visit.
       cache.strategy decides the token added to the app's file URLs:
         "release"    - app.version + app.releaseDate (bump them on each release)
         "custom"     - cache.token, any letters/digits/dots/hyphens you choose
         "auto"       - release.json written at deploy time, else the server's
                        ETag/Last-Modified of index.html
         "revalidate" - no token: the browser asks the server every time -->
  <script>
    window.Viraspa = {
      settings: {
        app: { name: "ViRaSPA Sample", version: "0.2.0", releaseDate: "2026-11-07T12:00:00" },
        cache: { strategy: "release", token: "" },
        pageCache: { maxPages: 5 },
      },
    };
  </script>

  <!-- The framework: one script. Its ?v= is the framework version, so it is
       re-downloaded only when the framework is updated. It loads base.css,
       the rest of the framework, then the app (app/config/startup.js). -->
  <script src="viraspa/viraspa.js?v=0.2.0"></script>

  <!-- Explicit includes: libraries the project opts into, as visible
       references. Keep each library in a versioned folder, so a new version
       is a new URL and needs no cache token. jQuery is included as a worked
       example (the sample contact page uses it); the framework never calls it.
       (Chart.js is loaded only by the Dashboard page, when it is opened.) -->
  <script src="lib/jquery/4.0.0/jquery.min.js"></script>
</body>
</html>
