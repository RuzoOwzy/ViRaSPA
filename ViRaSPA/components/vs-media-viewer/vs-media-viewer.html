<dialog part="dialog">
  <div class="bar" part="bar">
    <span class="title" part="title"></span>
    <span class="counter" part="counter"></span>
    <span class="tools">
      <button type="button" class="zoom-out">&minus;</button>
      <span class="zoom-level" aria-live="polite"></span>
      <button type="button" class="zoom-in">+</button>
      <button type="button" class="fit">&#x2922;</button>
      <button type="button" class="rotate">&#x21bb;</button>
    </span>
    <a class="download" download hidden>&#x2913;</a>
    <button type="button" class="close">&times;</button>
  </div>
  <div class="stage" part="stage"></div>
  <button type="button" class="nav prev" part="previous">&lsaquo;</button>
  <button type="button" class="nav next" part="next">&rsaquo;</button>
  <p class="caption" part="caption" hidden></p>
</dialog>
<slot></slot>
