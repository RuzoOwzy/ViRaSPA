<div class="field" part="field">
  <span class="prefix" part="prefix" aria-hidden="true"></span>
  <input type="text" autocomplete="off" spellcheck="false" role="spinbutton" part="input">
  <span class="suffix" part="suffix" aria-hidden="true"></span>
  <span class="spin" hidden>
    <button type="button" class="up" tabindex="-1" part="spin-button">&#9650;</button>
    <button type="button" class="down" tabindex="-1" part="spin-button">&#9660;</button>
  </span>
</div>
