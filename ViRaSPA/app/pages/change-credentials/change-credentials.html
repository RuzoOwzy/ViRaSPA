<div class="app-page page-change-credentials">
  <h1>{{title}}</h1>
  <p class="text-muted">{{intro}}</p>
  <form class="credentials-form" novalidate>
    <!-- Lets password managers know whose password this is. -->
    <input class="vs-visually-hidden" type="text" name="username" autocomplete="username" value="{{email}}" tabindex="-1" readonly aria-hidden="true">
    <div class="form-field">
      <label for="cc-current">Current Password</label>
      <input id="cc-current" name="current" type="password" autocomplete="current-password" required>
    </div>
    <div class="form-field">
      <label for="cc-new">New Password</label>
      <input id="cc-new" name="next" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="form-field">
      <label for="cc-confirm">Confirm New Password</label>
      <input id="cc-confirm" name="confirm" type="password" autocomplete="new-password" required>
    </div>
    <p class="form-message" role="alert" hidden></p>
    <button type="submit" class="btn">Change Password</button>
  </form>
</div>
