<div class="page-login">
  <div class="login-panel">
    <vs-login-form remember-me forgot-password-href="/contact" message-position="top">
      <img slot="logo" class="login-logo" src="app/assets/icons/favicon.svg" alt="" width="44" height="44">
    </vs-login-form>
  </div>
  <vs-card class="demo-hint" heading="{{demoTitle}}" icon="lucide:flask-conical">
    <p>{{demoText}}</p>
    <ul>
      <li><code>admin@example.com</code> / <code>admin</code> — {{adminText}}</li>
      <li><code>viewer@example.com</code> / <code>viewer</code> — {{viewerText}}</li>
    </ul>
  </vs-card>
</div>
